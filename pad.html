<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b16">
<title>يد التحكم — برامج وتطبيقات عبدالله</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#2a1e4b,#07070f 70%);color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#join{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;z-index:9;background:inherit}
#join h1{margin:0;font-size:26px}#join p{margin:0;color:#cbd5e1;line-height:1.7}
#code{font-size:40px;letter-spacing:.3em;text-align:center;width:220px;padding:10px;border-radius:16px;border:2px solid rgba(125,211,252,.5);background:rgba(255,255,255,.06);color:#fff;direction:ltr}
.btnMain{border:0;border-radius:999px;padding:14px 40px;font-size:20px;font-weight:900;background:linear-gradient(180deg,#ffe08a,#f59e0b);color:#1a1200}
#msg{min-height:22px;color:#fca5a5;font-weight:700}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:6}
#title{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px}
.tb{height:40px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:800}
.tb.on{background:rgba(255,209,102,.25);border-color:#ffd166}
#sp{flex:1}
#hearts{color:#ff4d6d}
#look{position:fixed;inset:0;z-index:1}
#gameFrame{position:fixed;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0;z-index:0;pointer-events:none;opacity:.35}
#streamB.on{background:rgba(74,222,128,.25);border-color:#4ade80}
#stickZone{position:fixed;left:0;top:56px;bottom:0;width:45%;z-index:2}
#base{position:fixed;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.02));display:none;pointer-events:none;z-index:3}
#knob{position:absolute;left:50%;top:50%;width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.65);transform:translate(-50%,-50%)}
#hint{position:fixed;left:5%;bottom:14%;color:rgba(255,255,255,.3);font-size:13px;z-index:2;pointer-events:none}
#pad{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:310px;height:250px;z-index:4}
#pad button{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(15,23,42,.6);color:#fff;font-size:26px;display:grid;place-items:center;touch-action:none;line-height:1}
#pad button small{position:absolute;bottom:-18px;font-size:11px;font-weight:800;color:rgba(255,255,255,.75);white-space:nowrap}
#pad button.down{transform:scale(.9);background:rgba(125,211,252,.4)}
#state{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;color:#94a3b8;z-index:3;pointer-events:none}
#modeSel{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:rgba(7,7,15,.96)}#modeSel.on{display:flex}#modeSel h2{margin:0}#modeSel p{margin:0;color:#cbd5e1}#modeSel button{width:min(520px,92vw);padding:14px;border-radius:18px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font:900 20px system-ui}#modeSel #mStream{background:linear-gradient(180deg,#22c55e,#15803d);border-color:#86efac}#modeSel small{display:block;font:600 13px system-ui;opacity:.85;margin-top:4px}
#hintBar{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:7;max-width:92vw;background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:8px 14px;font:800 14px system-ui;display:none;text-align:center}#hintBar.on{display:block}
#rot{display:none;position:fixed;inset:0;z-index:10;background:#07070f;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait){#rot.need{display:flex}}
/* 🎮 شكل جهاز محمول (مثل PSP): جسم أسود لامع، أزرار الأشكال، أكتاف L/R */
body.psp{background:linear-gradient(180deg,#1b1d24 0%,#0b0c10 55%,#14161c 100%)}
body.psp::before{content:"";position:fixed;inset:6px;border-radius:28px;border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 2px 0 rgba(255,255,255,.06),inset 0 -20px 60px rgba(0,0,0,.6);pointer-events:none;z-index:0}
body.psp #pad{width:300px;height:250px}
#pad button.face{border:0;background:radial-gradient(circle at 40% 30%,#3a3d48,#15161b 70%);box-shadow:0 5px 0 #050507,0 8px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.15)}
#pad button.face svg{width:46%;height:46%;filter:drop-shadow(0 0 6px currentColor)}
#pad button.face.down{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 #050507,0 3px 6px rgba(0,0,0,.5),inset 0 0 18px currentColor}
#pad button.face small{bottom:-20px;color:#e2e8f0;background:rgba(0,0,0,.55);padding:1px 8px;border-radius:999px;font-size:11px}
.shoulder{position:fixed;top:calc(52px + env(safe-area-inset-top));z-index:5;width:120px;height:44px;border:0;color:#e5e7eb;font:900 15px system-ui;background:linear-gradient(180deg,#3b3e49,#17181d);box-shadow:0 4px 0 #050507,inset 0 1px 0 rgba(255,255,255,.18);touch-action:none;display:flex;align-items:center;justify-content:center;gap:6px}
.shoulder.l{left:max(10px,env(safe-area-inset-left));border-radius:22px 10px 10px 22px}.shoulder.r{right:max(10px,env(safe-area-inset-right));border-radius:10px 22px 22px 10px}
.shoulder b{font-size:18px;color:#94a3b8}.shoulder.down{transform:translateY(3px);box-shadow:0 1px 0 #050507}
body.psp #base{border:3px solid #2a2d36;background:radial-gradient(circle,#1c1e25 55%,#101116);box-shadow:inset 0 4px 10px rgba(0,0,0,.7),0 0 0 6px rgba(255,255,255,.03)}
body.psp #knob{background:radial-gradient(circle at 40% 35%,#6b7080,#2b2e37 70%);border:2px solid #4b5060;box-shadow:0 4px 8px rgba(0,0,0,.6)}
.nubRest{position:fixed;left:max(70px,12vw);bottom:calc(70px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:3px solid #23262e;background:radial-gradient(circle,#1a1c22 50%,#0e0f13);box-shadow:inset 0 4px 12px rgba(0,0,0,.8);z-index:1;pointer-events:none;display:none}
body.psp .nubRest{display:block}body.psp .nubRest::after{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5b6070,#25272f 70%);box-shadow:0 3px 6px rgba(0,0,0,.6)}
body.psp.joying .nubRest{opacity:.15}
.sysBtns{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:14px;z-index:5}body.psp .sysBtns{display:flex}
.sysBtns{}body.psp #state{bottom:calc(40px + env(safe-area-inset-bottom))}
.sysBtns button{height:22px;padding:0 14px;border-radius:999px;border:0;background:#2a2d36;color:#cbd5e1;font:800 11px system-ui;box-shadow:0 2px 0 #050507}
</style>
</head>
<body>
<div id="join">
  <div style="font-size:54px">🎮</div>
  <h1>يد التحكم</h1>
  <p>على الشاشة الكبيرة افتح البوابة واضغط 📺<br>واكتب الكود اللي يطلع لك:</p>
  <input id="code" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
  <button class="btnMain" id="go">اتصل ▶</button>
  <div id="msg"></div>
</div>
<div id="look"></div>
<div id="stickZone"></div>
<div id="base"><div id="knob"></div></div>
<div id="hint">← العصا هنا</div>
<div id="top">
  <button class="tb" id="homeB" title="رجوع للبوابة">🏠</button>
  <span id="title"></span>
  <span class="pill" id="hearts" hidden></span><span class="pill" id="shards" hidden></span>
  <span id="sp"></span>
  <button class="tb" id="streamB" title="الجوال يشغّل اللعبة والتلفزيون يعرضها فيديو">📡 بث فائق</button>
  <button class="tb" id="menuB">🧭 قوائم</button>
  <button class="tb" id="pauseB" hidden>⏸</button>
</div>
<div class="nubRest"></div>
<button class="shoulder l" id="shL" hidden><b>L</b><span></span></button><button class="shoulder r" id="shR" hidden><span></span><b>R</b></button>
<div class="sysBtns"><button id="selB">SELECT · قوائم</button><button id="startB">START · ⏸</button></div>
<div id="pad"></div>
<div id="state">غير متصل</div>
<div id="modeSel">
  <h2>✅ اتصلت بالتلفزيون!</h2>
  <p>كيف تبغى تلعب؟</p>
  <button id="mStream">📡 العب على التلفزيون<small>الجوال يشغّل اللعبة بأعلى جودة والتلفزيون يعرضها مع الصوت — الأفضل والأنعم</small></button>
  <button id="mPad">🎮 يد تحكم بس<small>التلفزيون يشغّل اللعبة بنفسه (لأجهزة الكمبيوتر واللابتوب)</small></button>
</div>
<div id="hintBar"></div>
<div id="rot">📱↔️<br>دوّر الجوال بالعرض</div>
<script src="lib/peerjs.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let peer = null, conn = null, layout = { buttons: [] }, menu = false;
const st = { x: 0, y: 0, c: {}, h: {}, dx: 0, dy: 0 };
const q = new URLSearchParams(location.search).get('c'); if (q) $('#code').value = q.replace(/\D/g, '').slice(0, 4);
const msg = (t) => { $('#msg').textContent = t; };
async function goFull() { try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (e) {} try { await screen.orientation.lock('landscape'); } catch (e) {} wake(); }
async function wake() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
function press(id) { st.c[id] = (st.c[id] || 0) + 1; send(true); }

/* ---------- buttons are drawn from what the big screen says the current game needs ---------- */
const SLOTS = [{ r: 0, b: 6, s: 104 }, { r: 120, b: 0, s: 86 }, { r: 134, b: 110, s: 70 }, { r: 18, b: 128, s: 72 }, { r: 222, b: 70, s: 66 }, { r: 226, b: 160, s: 60 }];
// ترتيب PSP: ✕ تحت، □ يسار، ○ يمين، △ فوق — والباقي على الأكتاف
const FACE = [{ r: 96, b: 8, s: 78, sym: 'x', col: '#60a5fa' }, { r: 188, b: 92, s: 74, sym: 'sq', col: '#f472b6' }, { r: 4, b: 92, s: 74, sym: 'o', col: '#f87171' }, { r: 96, b: 172, s: 70, sym: 'tri', col: '#4ade80' }];
const SYM = { x: '<path d="M14 14L50 50M50 14L14 50"/>', sq: '<rect x="14" y="14" width="36" height="36" rx="2"/>', o: '<circle cx="32" cy="32" r="19"/>', tri: '<path d="M32 12L54 50H10z"/>' };
const svgSym = (k) => '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">' + SYM[k] + '</svg>';
const PSP = !/[?&]classic\b/.test(location.search); if (PSP) document.body.classList.add('psp');
const COLORS = ['rgba(125,211,252,.85)', 'rgba(255,120,120,.85)', 'rgba(255,255,255,.4)', 'rgba(255,209,102,.8)', 'rgba(167,139,250,.85)', 'rgba(52,211,153,.8)'];
function render() {
  const pad = $('#pad'); pad.innerHTML = '';
  const menuOnly = !!layout.menuOnly, M = menu || menuOnly;
  $('#title').textContent = layout.title || '';
  $('#menuB').hidden = menuOnly; $('#menuB').classList.toggle('on', menu); $('#menuB').textContent = menu ? '🎮 رجوع للعب' : '🧭 قوائم';
  $('#pauseB').hidden = !layout.pause || M; $('#homeB').hidden = !layout.title || menuOnly && !layout.native && layout.title === 'برامج وتطبيقات عبدالله';
  $('#look').style.pointerEvents = layout.look && !M ? 'auto' : 'none';
  $('#hint').textContent = M ? '← العصا تتنقّل بين الأزرار على الشاشة' : layout.look ? '← العصا هنا • اسحب بالنص للكاميرا' : '← العصا هنا';
  const list = M ? [{ id: '__ok', label: '✅ اختيار' }] : (layout.buttons || []);
  for (const k of ['shL', 'shR']) { const e = $('#' + k); e.hidden = true; e.onpointerdown = null; }
  list.slice(0, 6).forEach((b, i) => {
    if (PSP && i >= 4) { // L/R
      const e = $(i === 4 ? '#shR' : '#shL'), parts = String(b.label).split(' '); e.hidden = false; e.querySelector('span').textContent = parts.length > 1 ? parts.slice(1).join(' ') : b.label; const id = b.id;
      e.onpointerdown = (ev) => { ev.preventDefault(); try { e.setPointerCapture(ev.pointerId); } catch (_) {} st.c[id] = (st.c[id] || 0) + 1; st.h[id] = true; e.classList.add('down'); if (navigator.vibrate) navigator.vibrate(12); send(true); };
      e.onpointerup = e.onpointercancel = e.onlostpointercapture = () => { st.h[id] = false; e.classList.remove('down'); send(true); };
      return;
    }
    const sl = PSP ? FACE[i] : SLOTS[i], el = document.createElement('button'), parts = String(b.label).split(' ');
    const icon = parts.length > 1 && /\p{Extended_Pictographic}/u.test(parts[0]) ? parts[0] : (b.icon || parts[0].slice(0, 2));
    const name = parts.length > 1 ? parts.slice(1).join(' ') : b.label;
    el.innerHTML = `<span></span><small></small>`; el.firstChild.textContent = icon; el.lastChild.textContent = name;
    Object.assign(el.style, { width: sl.s + 'px', height: sl.s + 'px', right: sl.r + 'px', bottom: sl.b + 'px', borderColor: COLORS[i] });
    if (PSP) { el.classList.add('face'); el.style.color = sl.col; el.firstChild.outerHTML; el.innerHTML = svgSym(sl.sym) + '<small></small>'; el.lastChild.textContent = name; }
    else if (i === 0) el.style.fontSize = '36px';
    const id = b.id;
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) {} st.c[id] = (st.c[id] || 0) + 1; st.h[id] = true; el.classList.add('down'); if (navigator.vibrate) navigator.vibrate(12); send(true); });
    const up = () => { st.h[id] = false; el.classList.remove('down'); send(true); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
    pad.appendChild(el);
  });
}
/* ---------- 📡 super stream: this phone runs the game in 1080p and streams it to the TV as live video ---------- */
let gameFrame = null, call = null, streaming = false, codeUsed = '', tvInfo = null, ackTimer = 0;
const hint = (t, ms = 7000) => { const h = $('#hintBar'); h.textContent = t; h.classList.add('on'); clearTimeout(hint.t); if (ms) hint.t = setTimeout(() => h.classList.remove('on'), ms); };
function tvAck(s) {
  clearTimeout(ackTimer);
  if (s === 'playing') { hint('✅ التلفزيون يعرض اللعبة الحين — ناظر الشاشة الكبيرة 📺'); $('#gameFrame') && ($('#gameFrame').style.opacity = '0.12'); }
  else if (s === 'muted') hint('🔇 الصورة طلعت بس التلفزيون منع الصوت — اضغط OK بالريموت على زر «تشغيل الصوت»', 12000);
  else hint('⚠️ التلفزيون ما قدر يشغّل الفيديو — حدّث صفحة البوابة بالتلفزيون وجرّب مرة ثانية', 0);
}
$('#mStream').onclick = () => { $('#modeSel').classList.remove('on'); startStream(); };
$('#mPad').onclick = () => { $('#modeSel').classList.remove('on'); hint('🎮 وضع يد التحكم — تقدر تشغّل البث بأي وقت من زر «📡 بث فائق» فوق'); };
// prefer H.264 so the TV decodes the video in hardware (smooth even on old TVs)
/* adaptive stream ladder — the TV reports how many frames it really shows; we step quality down/up */
const LADDER = [{ w: 1920, h: 1080, fps: 30, br: 7e6, n: '1080p' }, { w: 1280, h: 720, fps: 30, br: 3.5e6, n: '720p' }, { w: 960, h: 540, fps: 30, br: 2e6, n: '540p' }, { w: 854, h: 480, fps: 24, br: 1.3e6, n: '480p' }, { w: 640, h: 360, fps: 24, br: 0.8e6, n: '360p' }];
let lvl = 1, goodRuns = 0, badRuns = 0;
function applyLevel(i) {
  lvl = Math.max(0, Math.min(LADDER.length - 1, i)); const L = LADDER[lvl];
  try { gameFrame.contentWindow.__setStream(L.w, L.h, L.fps); } catch (e) {}
  try { call.peerConnection.getSenders().forEach((s) => { if (!s.track || s.track.kind !== 'video') return; const p = s.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}]; p.encodings[0].maxBitrate = L.br; p.encodings[0].maxFramerate = L.fps; p.degradationPreference = 'balanced'; s.setParameters(p).catch(() => {}); }); } catch (e) {}
  goodRuns = badRuns = 0;
}
function onStats(st2) {
  const L = LADDER[lvl], ratio = st2.fps / L.fps;
  $('#state').textContent = `📡 بث ${L.n} · التلفزيون يعرض ${Math.round(st2.fps)} إطار/ث${st2.w ? ` · ${st2.w}×${st2.h}` : ''}`;
  if (ratio < 0.6) { badRuns++; goodRuns = 0; if (badRuns >= 2 && lvl < LADDER.length - 1) { applyLevel(lvl + 1); hint('📉 خففت جودة البث عشان تكون أنعم: ' + LADDER[lvl].n, 4000); } }
  else if (ratio > 0.9) { goodRuns++; badRuns = 0; if (goodRuns >= 5 && lvl > 0) { applyLevel(lvl - 1); hint('📈 البث سلس — رفعت الجودة: ' + LADDER[lvl].n, 4000); } }
  else { goodRuns = badRuns = 0; }
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function startStream() {
  if (!conn || !conn.open) return;
  if (!tvInfo || !tvInfo.stream) { hint('⚠️ التلفزيون عليه نسخة قديمة من البوابة — بالتلفزيون حدّث الصفحة (أو سكّر المتصفح وافتحه)، واضغط 📺 من جديد، وبعدين امسح الرمز', 0); return; }
  try { conn.send({ streamStart: true }); } catch (e) {}
  hint('⏳ أجهّز اللعبة وأبثها للتلفزيون…', 0);
  const btn = $('#streamB'); btn.textContent = '⏳ تجهيز…'; btn.disabled = true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; window.__padAudio = new AC(); await window.__padAudio.resume();
    gameFrame = document.createElement('iframe'); gameFrame.id = 'gameFrame'; gameFrame.src = 'apps/ninja-worlds/?stream=1'; gameFrame.allow = 'autoplay';
    document.body.appendChild(gameFrame); fitFrame();
    let w = null; for (let i = 0; i < 150; i++) { await sleep(100); try { w = gameFrame.contentWindow; if (w.__G && w.__getStream && w.__castInput) break; } catch (e) {} w = null; }
    if (!w) throw new Error('game');
    w.__G.start(); await sleep(400);
    const stream = w.__getStream();
    call = peer.call('abdcast-' + codeUsed, stream);
    call.on('close', stopStream);
    setTimeout(() => applyLevel(1), 800);
    ackTimer = setTimeout(() => tvAck('error'), 12000);
    streaming = true; btn.classList.add('on'); btn.textContent = '📡 يبث ✓'; layout = Object.assign({}, w.__castLayout, { native: true }); menu = false; render();
    $('#state').textContent = '📡 بث فائق: الجوال يشغّل اللعبة 1080p والتلفزيون يعرضها';
  } catch (e) { $('#state').textContent = '⚠️ ما قدرت أبدأ البث — جرّب مرة ثانية'; stopStream(); }
  btn.disabled = false;
}
function stopStream() {
  streaming = false; try { call && call.close(); } catch (e) {} call = null;
  if (gameFrame) { gameFrame.remove(); gameFrame = null; }
  try { window.__padAudio && window.__padAudio.close(); } catch (e) {}
  const btn = $('#streamB'); btn.classList.remove('on'); btn.textContent = '📡 بث فائق';
}
function fitFrame() { if (gameFrame) gameFrame.style.transform = `scale(${Math.min(innerWidth / 1280, innerHeight / 720)})`; }
addEventListener('resize', fitFrame);
$('#streamB').onclick = () => (streaming ? stopStream() : startStream());
$('#menuB').onclick = () => { menu = !menu; st.h = {}; render(); send(true); };
$('#homeB').onclick = () => { if (streaming) { stopStream(); return; } press('__back'); menu = false; };
$('#pauseB').onclick = () => press('pause');
$('#selB').onclick = () => $('#menuB').click(); $('#startB').onclick = () => press('pause');

function connect() {
  const code = $('#code').value.replace(/\D/g, ''); if (code.length !== 4) return msg('الكود ٤ أرقام');
  msg(''); $('#go').disabled = true; $('#go').textContent = '⏳ جاري الاتصال…'; goFull();
  if (peer) try { peer.destroy(); } catch (e) {}
  peer = new Peer({ debug: 0 });
  peer.on('open', () => {
    codeUsed = code; conn = peer.connect('abdcast-' + code, { reliable: false, serialization: 'json' });
    const to = setTimeout(() => { if (!conn || !conn.open) fail('ما قدرت أوصل — تأكد من الكود وإن الجهازين على نفس الواي فاي'); }, 12000);
    conn.on('open', () => { clearTimeout(to); $('#modeSel').classList.add('on'); $('#join').style.display = 'none'; $('#rot').classList.add('need'); $('#state').textContent = '✅ متصل — ' + code; if (navigator.vibrate) navigator.vibrate(40); render(); });
    conn.on('data', (d) => {
      if (!d) return;
      if (d.layout) { layout = d.layout; if (layout.native || !layout.menuOnly) menu = false; $('#hearts').hidden = $('#shards').hidden = true; render(); }
      if (d.hello) tvInfo = d.hello;
      if (d.tv === 'stats') onStats(d); else if (d.tv) tvAck(d.tv);
      if (d.vib && navigator.vibrate) navigator.vibrate(d.vib);
      if (d.hp != null) { $('#hearts').hidden = false; $('#hearts').textContent = '❤'.repeat(Math.max(0, d.hp)) + '♡'.repeat(Math.max(0, (d.max || 5) - d.hp)); }
      if (d.sh) { $('#shards').hidden = false; $('#shards').textContent = d.sh; }
    });
    conn.on('close', () => { $('#state').textContent = '⚠️ انقطع الاتصال'; $('#join').style.display = ''; $('#go').disabled = false; $('#go').textContent = 'اتصل مرة ثانية ▶'; });
  });
  peer.on('error', (e) => fail(e.type === 'peer-unavailable' ? 'الكود غلط أو البوابة مو مفتوحة على الشاشة الكبيرة' : 'صار خطأ بالاتصال (' + e.type + ')'));
}
function fail(t) { msg(t); $('#go').disabled = false; $('#go').textContent = 'اتصل ▶'; }
$('#go').onclick = connect;
$('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });

/* ---------- stick + camera ---------- */
let joy = null, look = null; const base = $('#base'), knob = $('#knob');
$('#stickZone').addEventListener('pointerdown', (e) => { document.body.classList.add('joying'); joy = { id: e.pointerId, x: e.clientX, y: e.clientY }; base.style.left = e.clientX + 'px'; base.style.top = e.clientY + 'px'; base.style.display = 'block'; e.target.setPointerCapture(e.pointerId); });
$('#stickZone').addEventListener('pointermove', (e) => { if (!joy || e.pointerId !== joy.id) return; let dx = e.clientX - joy.x, dy = e.clientY - joy.y; const l = Math.hypot(dx, dy), m = 62; if (l > m) { dx = dx / l * m; dy = dy / l * m; } st.x = dx / m; st.y = -dy / m; knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; });
const endJoy = (e) => { if (joy && e.pointerId === joy.id) { document.body.classList.remove('joying'); joy = null; st.x = st.y = 0; base.style.display = 'none'; knob.style.transform = 'translate(-50%,-50%)'; } };
$('#stickZone').addEventListener('pointerup', endJoy); $('#stickZone').addEventListener('pointercancel', endJoy);
$('#look').addEventListener('pointerdown', (e) => { look = { id: e.pointerId, x: e.clientX, y: e.clientY }; e.target.setPointerCapture(e.pointerId); });
$('#look').addEventListener('pointermove', (e) => { if (!look || e.pointerId !== look.id) return; st.dx += (e.clientX - look.x) * 1.6; st.dy += (e.clientY - look.y) * 1.6; look.x = e.clientX; look.y = e.clientY; });
const endLook = (e) => { if (look && e.pointerId === look.id) look = null; };
$('#look').addEventListener('pointerup', endLook); $('#look').addEventListener('pointercancel', endLook);

/* ---------- stream (press counters are cumulative, so a dropped packet never loses a press) ---------- */
let lastSend = 0, lastStr = '';
function send(force) {
  if (!conn || !conn.open) return;
  const o = { x: +st.x.toFixed(3), y: +st.y.toFixed(3), c: st.c, h: st.h, m: menu, dx: Math.round(st.dx), dy: Math.round(st.dy) };
  const s = JSON.stringify(o), now = performance.now();
  if (!force && s === lastStr && now - lastSend < (streaming ? 16 : 120)) return;
  if (streaming && gameFrame) { try { const w = gameFrame.contentWindow; w.__castInput(o); st.dx = 0; st.dy = 0; lastStr = s; lastSend = now;
      const P = w.__G.player; if (P && (now - (send.hudT || 0) > 300)) { send.hudT = now; $('#hearts').hidden = false; $('#hearts').textContent = '❤'.repeat(Math.max(0, P.hp)) + '♡'.repeat(Math.max(0, P.maxHp - P.hp)); }
      const L2 = w.__castLayout; const ls = JSON.stringify(L2); if (ls !== send.lastL) { send.lastL = ls; layout = Object.assign({}, L2, { native: true }); render(); } } catch (e) {} return; }
  try { conn.send(o); st.dx = 0; st.dy = 0; lastStr = s; lastSend = now; } catch (e) {}
}
(function loop() { send(false); requestAnimationFrame(loop); })();
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
</script>
</body>
